<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baby Tracker · Download</title>
  <meta name="description" content="Baby Tracker: free on the App Store and Google Play." />
  <script>
    // Sends each phone to its store; unknown devices (desktop) keep the two buttons below.
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var store = ios ? "https://apps.apple.com/app/id6781867516"
      : /Android/.test(ua) ? "https://play.google.com/store/apps/details?id=com.aibabytracking&referrer=utm_source%3Dinstagram_en"
      : null;
    if (store) location.replace(store);
  </script>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .stores { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .stores a {
      flex: 1 1 200px; text-align: center; padding: 14px 18px; border-radius: 12px;
      background: var(--primary); color: #fff; font-weight: 700;
    }
    .stores a:hover { text-decoration: none; opacity: .9; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div class="logo">🍼</div>
      <div class="brand">Baby Tracker</div>
    </header>

    <section class="card">
      <h1>Get Baby Tracker for free</h1>
      <p>Pick your phone's store.</p>
      <div class="stores">
        <a href="https://apps.apple.com/app/id6781867516">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=com.aibabytracking&amp;referrer=utm_source%3Dinstagram_en">Google Play</a>
      </div>
    </section>

    <footer>© 2026 Baby Tracker</footer>
  </div>
</body>
</html>
